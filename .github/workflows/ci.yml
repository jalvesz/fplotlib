name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # One job per compiler, each with nothing installed but that compiler and
  # fpm. `fpm test` builds the package, writes every test plot and checks it
  # against tests/fingerprints.txt.
  #
  # The compilers come from setup-fortran rather than from pixi, so each is
  # the latest the action offers rather than the latest conda-forge has. The
  # pixi environments stay for building the same thing by hand.
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      # Every compiler is a gate, so report all four instead of stopping at
      # the first one that breaks.
      fail-fast: false
      matrix:
        include:
          # opt is a second run with fused multiply-add allowed: the rounding
          # then differs from the plain build, and the pictures must not.
          - name: GFortran
            compiler: gfortran
            args: ""
            opt: "--flag '-O3 -march=native'"
          - name: Flang
            compiler: flang
            args: ""
            opt: "--flag '-O3 -march=native'"
          # ifx reassociates by default, which is more than -O3 asks of the
          # others: it turns a linspace into a running sum, so the last point
          # of 2*pi*i/(n-1) and the exactly-zero column of a contour grid move
          # by a few ulps and a sign test lands the other way.
          # -fp-model precise holds it to the same standard as the rest; that
          # is the spelling fpm itself uses for Intel on Unix (/fp:precise on
          # Windows).
          # Note that --flag replaces fpm's profile flags rather than adding
          # to them, so the optimisation level is spelled out here.
          - name: ifx
            compiler: ifx
            args: "--flag '-O2 -fp-model precise'"
            opt: "--flag '-O3 -march=native -fp-model precise'"
          - name: LFortran
            compiler: lfortran
            args: ""
            opt: ""
    steps:
      - uses: actions/checkout@v4

      - name: Set up ${{ matrix.compiler }}
        id: fortran
        uses: fortran-lang/setup-fortran@v2.0.0-beta.13
        with:
          compiler: ${{ matrix.compiler }}
          version: latest

      - uses: fortran-lang/setup-fpm@v10
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Test
        run: fpm test --compiler ${{ steps.fortran.outputs.fc }} ${{ matrix.args }}

      - name: Test with -O3 -march=native
        if: matrix.opt
        run: fpm test --compiler ${{ steps.fortran.outputs.fc }} ${{ matrix.opt }}

      # The same flags as the first run, so this reuses that build.
      - name: Demo
        run: fpm run --example demo --compiler ${{ steps.fortran.outputs.fc }} ${{ matrix.args }}

      # The pictures, to look at when a fingerprint or a comparison fails.
      - name: Upload the test pictures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tests-out-${{ matrix.compiler }}
          path: tests/out/

  sdl3:
    name: Optional SDL3 backend (Linux dummy video)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: fortran-lang/setup-fortran@v2.0.0-beta.13
        with:
          compiler: gfortran
          version: latest
      - uses: fortran-lang/setup-fpm@v10
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build SDL3 with dummy video driver
        run: |
          curl -fsSL https://github.com/libsdl-org/SDL/releases/download/release-3.4.2/SDL3-3.4.2.tar.gz | tar xz
          cmake -S SDL3-3.4.2 -B sdl-build \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/sdl3" \
            -DSDL_X11=OFF -DSDL_WAYLAND=OFF -DSDL_UNIX_CONSOLE_BUILD=ON \
            -DSDL_TEST_LIBRARY=OFF -DSDL_TESTS=OFF
          cmake --build sdl-build --parallel 2
          cmake --install sdl-build
      - name: Test optional package
        working-directory: backends/sdl3
        run: |
          export PKG_CONFIG_PATH="$RUNNER_TEMP/sdl3/lib/pkgconfig"
          export LD_LIBRARY_PATH="$RUNNER_TEMP/sdl3/lib"
          export SDL_VIDEODRIVER=dummy
          fpm test --c-flag "$(pkg-config --cflags sdl3)" \
            --link-flag "$(pkg-config --libs-only-L sdl3)"
          cd integration
          fpm run --c-flag "$(pkg-config --cflags sdl3)" \
            --link-flag "$(pkg-config --libs-only-L sdl3)"

  # The pictures of the flang build against matplotlib's. The first step makes
  # the references and the pictures; the comparisons after it reuse both.
  # This one stays on pixi, which is where matplotlib and the rasterizers are.
  matplotlib:
    name: Matplotlib comparison (Flang)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: v0.76.1
          cache: true
          locked: true
          environments: matplotlib
      - name: Matplotlib references and flang pictures
        run: pixi run mpl-refs && pixi run test-outputs
      - name: Compare SVG
        run: pixi run compare
      - name: Compare PNG
        run: pixi run compare-png
      - name: Compare PDF
        run: pixi run compare-pdf
      - name: Compare EPS
        run: pixi run compare-eps
      - name: Compare GIF
        run: pixi run compare-gif
      # The pictures, to look at when a fingerprint or a comparison fails.
      - name: Upload the test pictures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tests-out-matplotlib
          path: tests/out/

  # Human-only commit authorship: no AI author, committer, or Co-Authored-By
  # stamp. Same checker as LFortran's Quick checks. AI tools may help write
  # the code; a human still has to be the one who submits and guarantees it.
  # Legitimate human co-authors are left alone. The script compares
  # origin/main..HEAD, so it needs the base branch and the whole PR history.
  authorship:
    name: AI commit authorship
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the authorship patterns
        run: python3 check_ai_commit_authorship.py --self-test

      - name: Check for AI commit authorship
        run: python3 check_ai_commit_authorship.py

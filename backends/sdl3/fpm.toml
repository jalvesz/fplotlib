name = "fplotlib-sdl3"
version = "0.1.0"
license = "MIT"

[build]
auto-executables = false
auto-examples = false
auto-tests = false
link = ["SDL3"]

[dependencies]
fplotlib = { path = "../.." }

[[example]]
name = "sdl3-demo"
source-dir = "app"
main = "demo.f90"

[[test]]
name = "sdl3-test"
source-dir = "test"
main = "test_sdl3.f90"
